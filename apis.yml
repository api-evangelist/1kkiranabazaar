aid: 1kkiranabazaar
name: 1K Kirana Bazaar
description: >-
  1K Kirana Bazaar (legal entity Odicea Distribution Technologies Private Limited, also
  trading as 1K Networks) is a Gurugram, Haryana based Indian kirana-tech company founded
  in 2018 by Kumar Sangeetesh, Sachin Sharma and Abhishek Halder. It franchised
  neighbourhood grocery stores across Delhi NCR, Haryana, Rajasthan and Uttar Pradesh and
  gave them an operating stack — a point-of-sale and inventory system, direct FMCG
  sourcing through its own B2B distribution network, store-level analytics, payments, the
  Farm Gold private label, the OneClub loyalty programme, and a consumer ordering app that
  turned the store into a local fulfilment point. At its peak the company reported around
  1,000 partner stores, more than a million customers and coverage of 25-plus districts,
  and it raised roughly $36-44 million across seed, Series A ($7M, 2021), Series B ($25M,
  2022) and a 2023 bridge round from Info Edge Ventures, Falcon Edge Capital, Alpha Wave
  Global and Quiet Capital. Operations all but stopped in May 2024 amid a funding shortfall
  and reported bankruptcy and distress-sale discussions, after headcount fell from over
  1,000 to roughly 30. The company never operated a public developer program: there is no
  developer portal, API reference, OpenAPI or other machine-readable specification, SDK,
  package or webhook catalogue on any domain it controls, and the API hosts it once ran
  internally (api., api-gateway., vendor-api., wms-*-api., go-api-staging.1knetworks.com)
  are all NXDOMAIN today. The company's own surviving web presence is the single-page
  marketing site at www.1knetworks.in, whose WHOIS registrant organization is Odicea
  Distribution Technologies Private Limited.
