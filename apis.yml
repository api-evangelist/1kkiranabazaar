x-status-note: >-
  Inc42 reported in 2024 that 1K Kirana had all but shut shop in May 2024, was facing
  possible bankruptcy and a distress sale, and was down to roughly 30 employees from over
  1,000 in August 2023, with its website non-functional and its Android and iOS consumer
  apps unusable. A single-page marketing site is live again at www.1knetworks.in and
  carries a 2026 copyright line, but no operating or funding event after the 2023 bridge
  round has been found, so the company is recorded as distressed rather than either
  operating normally or formally defunct.
