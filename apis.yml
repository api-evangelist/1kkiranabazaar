x-api-posture-note: >-
  Nothing in this company's public surface is a developer product. The live site
  (www.1knetworks.in) is a one-page Astro build whose entire navigation is in-page anchors
  (#home, #platform, #cta) — there is no /developers, /docs, /api or /pricing page to
  reach — and the words API, SDK, webhook and developer do not appear anywhere in its
  rendered text. The Wayback Machine holds 329 distinct URLs for 1knetworks.com covering
  its whole operating history; the only API-shaped entries are internal service hosts
  (api., api-gateway., api-gateway-staging., bulky-api., go-api-staging., gweb1k-apis.,
  stageapi., vendor-api., webv0-api-uat., wms-staging-api.1knetworks.com) plus
  third-party crawler probes of /.well-known/*, and every one of those hosts is NXDOMAIN
  as of this probe. Products were retailer and consumer mobile apps (Android package
  com.niyotail.consumer) and an in-store PoS, not an API.
