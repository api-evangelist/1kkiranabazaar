  while trading, but it was re-registered 2025-03-29 behind a Domains By Proxy privacy
  service and its origin no longer completes a TLS handshake, so no present-day response
  from it is attributed to the company.
robots_note: >-
  https://www.1knetworks.in/robots.txt (HTTP 200, text/plain) is Cloudflare's managed
  content-signals file. It sets `User-agent: * / Content-Signal:
  search=yes,ai-train=no,use=reference / Allow: /` and then adds a Disallow for a named
  list of AI crawlers — Amazonbot, Applebot-Extended, Bytespider, CCBot, ClaudeBot,
  CloudflareBrowserRenderingCrawler, Google-Extended, GPTBot and meta-externalagent. Only
  paths permitted to the `*` group were read, and the content signal `ai-train=no` is
  honored: nothing from this host is used as model training input.
